apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  config.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    clients:
      - url: http://loki:3100/loki/api/v1/push   # Service Loki dans le même namespace

    positions:
      filename: /run/promtail/positions.yaml

    scrape_configs:
    - job_name: scpi-inv-api-logs
      static_configs:
        - targets:
            - localhost
          labels:
            job: scpi-inv-api
            __path__: /var/log/containers/scpi-inv-api*.log
      
      pipeline_stages:
        # 1) Les fichiers de /var/log/containers sont au format CRI :
        #    <ts> <stream> <flag> <log>
        - cri: {}
        
        # 2) Le "log" est ton JSON Spring Boot → on parse
        - json:
            expressions:
              level: level
              message: message
              logger: logger_name
              env: env
              application: application
              thread: thread_name
        
        # 3) On promeut quelques champs JSON en labels Loki
        - labels:
            level:
            application:
            env:
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.0
          args:
            - -config.file=/etc/promtail/config.yml
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail/config.yml
              subPath: config.yml
            - name: varlog
              mountPath: /var/log
            - name: run-promtail
              mountPath: /run/promtail
      volumes:
        - name: promtail-config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log            # là où Kube écrit les logs containers sur le nœud
        - name: run-promtail
          emptyDir: {}
