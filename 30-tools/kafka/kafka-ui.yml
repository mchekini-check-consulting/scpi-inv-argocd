apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "{{.Values.kafka.clusterName}}"
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "{{.Values.kafka.bootstrapServers}}"
            - name: KAFKA_CLUSTERS_0_ZOOKEEPER
              value: "{{.Values.kafka.zookeeper}}"
            - name: SERVER_PORT
              value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080

