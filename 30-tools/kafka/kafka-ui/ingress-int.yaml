apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafka-ui-int
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: lets-encrypt
spec:
  tls:
    - hosts:
        - int.kafka-ui.check-consulting.net
      secretName: kafka-ui-int-tls
  rules:
    - host: int.kafka-ui.check-consulting.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafka-ui
                port:
                  number: 8080
