apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-ui-qua-tls
spec:
  secretName: kafka-ui-qua-tls
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lets-encrypt
  dnsNames:
    - qua.kafka-ui.check-consulting.net
  usages:
    - digital signature
    - key encipherment
