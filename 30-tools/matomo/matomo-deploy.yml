apiVersion: apps/v1
kind: Deployment
metadata:
  name: matomo
  namespace: matomo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matomo
  template:
    metadata:
      labels:
        app: matomo
    spec:
      containers:
        - name: web
          image: matomo:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MATOMO_DATABASE_HOST
              value: mariadb.matomo.svc.cluster.local
            - name: MATOMO_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: mariadb-user
            - name: MATOMO_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: mariadb-password
            - name: MATOMO_DATABASE_DBNAME
              valueFrom:
                secretKeyRef:
                  name: mariadb-secrets
                  key: mariadb-database
            - name: MATOMO_URL
              value: "https://matomo.check-consulting.net"
          ports:
            - containerPort: 80